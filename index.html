<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>سَكينة | Soukoun</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Tajawal:wght@400;500;700;900&family=Amiri+Quran&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg-base: #000000;
    --card-bg: rgba(255, 255, 255, 0.06); 
    --glass-border: rgba(255, 255, 255, 0.1);
    --accent: #1DB954; 
    --text-primary: #ffffff;
    --text-secondary: #a1a1a6; 
    --blur: blur(25px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif; }
body {
    background: #000;
    background-image: radial-gradient(circle at 10% 10%, rgba(29, 185, 84, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}
.phone-wrapper { width: 100%; max-width: 480px; padding: 20px 16px 160px 16px; min-height: 100vh; }
.apple-header { display: flex; justify-content: center; align-items: center; padding: 10px 0 20px 0; }
.apple-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.reciters-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.reciter-card {
    background: var(--card-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s;
}
.reciter-card:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }
.reciter-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
.reciter-name { font-size: 15px; font-weight: 700; }
.reciter-role { font-size: 12px; color: var(--text-secondary); }
.surah-list { display: flex; flex-direction: column; gap: 10px; }
.surah-item {
    background: var(--card-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: 18px; padding: 16px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s;
}
.surah-item:active { background: rgba(255, 255, 255, 0.12); }
.surah-info { display: flex; align-items: center; gap: 12px; }
.surah-num { width: 32px; height: 32px; background: rgba(255,255,255,0.08); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.surah-item.active .surah-num { background: var(--accent); color: #000; }
.surah-name { font-size: 16px; font-weight: 700; }
.surah-translated { font-size: 12px; color: var(--text-secondary); }

/* المشغل السفلي */
.spotify-player {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 448px; background: rgba(30, 30, 30, 0.85);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 100;
}
.player-info { display: flex; align-items: center; gap: 12px; }
.player-cover { width: 48px; height: 48px; background: linear-gradient(135deg, #222, #111); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--accent); font-size: 18px; }
.player-text { display: flex; flex-direction: column; }
.player-title { font-size: 14px; font-weight: 700; }
.player-artist { font-size: 12px; color: var(--text-secondary); }
.player-controls { display: flex; gap: 12px; align-items: center; }
.btn-play { width: 40px; height: 40px; border-radius: 50%; background: var(--text-primary); color: #000; border: none; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; }
.btn-icon { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; transition: color 0.2s; }
.btn-icon.active { color: var(--accent); }

/* صفحة القراءة */
.quran-reader { display: none; flex-direction: column; gap: 16px; }
.reader-header { text-align: center; margin-bottom: 20px; }
.reader-title { font-family: 'Amiri Quran', serif; font-size: 32px; font-weight: 700; }
.reader-ayahs {
    font-family: 'Amiri Quran', serif; font-size: 24px; line-height: 2.2; text-align: justify; direction: rtl;
    background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px 20px;
}
.ayah-marker {
    display: inline-flex; justify-content: center; align-items: center; width: 32px; height: 32px;
    border-radius: 50%; background: rgba(29, 185, 84, 0.15); color: var(--accent); font-size: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif; margin: 0 6px; vertical-align: middle;
}
.apple-back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--glass-border); color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 16px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="phone-wrapper">
    <div id="homePage">
        <div class="apple-header"><h1 class="apple-title">استكشف</h1></div>
        <div class="reciters-grid" id="recitersGrid"></div>
    </div>

    <div id="surahsPage" class="hidden">
        <button class="apple-back-btn" onclick="goBack('homePage')"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="apple-header" style="padding-top:0; justify-content: flex-start; padding-right: 10px;">
            <h1 class="apple-title" id="reciterNameTitle">السور</h1>
        </div>
        <div class="surah-list" id="surahListContainer"></div>
    </div>

    <div id="quranPage" class="hidden quran-reader">
        <button class="apple-back-btn" onclick="goBack('surahsPage')"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="reader-header"><h1 class="reader-title" id="quranTitle">الفاتحة</h1></div>
        <div class="reader-ayahs" id="quranTextContainer"></div>
    </div>
</div>

<div class="spotify-player">
    <div class="player-info">
        <div class="player-cover"><i class="fa-solid fa-music"></i></div>
        <div class="player-text">
            <div class="player-title" id="playerTitle">اختر سورة</div>
            <div class="player-artist" id="playerArtist">سكينة</div>
        </div>
    </div>
    <div class="player-controls">
        <button class="btn-icon" id="loopBtn" onclick="toggleLoop()"><i class="fa-solid fa-repeat"></i></button>
        <button class="btn-icon" onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
        <button class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
    </div>
</div>

<audio id="audioPlayer" crossorigin="anonymous"></audio>

<script>

    {id:"015", name:"الحجر", en:"Al-Hijr"}, {id:"016", name:"النحل", en:"An-Nahl"},
    {id:"017", name:"الإسراء", en:"Al-Isra'"}, {id:"018", name:"الكهف", en:"Al-Kahf"},
    {id:"019", name:"مريم", en:"Maryam"}, {id:"020", name:"طه", en:"Taha"},
    {id:"021", name:"الأنبياء", en:"Al-Anbiya'"}, {id:"022", name:"الحج", en:"Al-Hajj"},
    {id:"023", name:"المؤمنون", en:"Al-Mu'minun"}, {id:"024", name:"النور", en:"An-Nur"},

    {id:"065", name:"الطلاق", en:"At-Talaq"}, {id:"066", name:"التحريم", en:"At-Tahrim"},
    {id:"067", name:"الملك", en:"Al-Mulk"}, {id:"068", name:"القلم", en:"Al-Qalam"},
    {id:"069", name:"الحاقة", en:"Al-Haqqah"}, {id:"070", name:"المعارج", en:"Al-Ma'arij"},
    {id:"071", name:"نوح", en:"Nuh"}, {id:"072", name:"الجن", en:"Al-Jinn"},
    {id:"073", name:"المزمل", en:"Al-Muzzammil"}, {id:"074", name:"المدثر", en:"Al-Muddaththir"},
    {id:"075", name:"القيامة", en:"Al-Qiyamah"}, {id:"076", name:"الإنسان", en:"Al-Insan"},
    {id:"077", name:"المرسلات", en:"Al-Mursalat"}, {id:"078", name:"النبأ", en:"An-Naba'"},
    {id:"079", name:"النازعات", en:"An-Nazi'at"}, {id:"080", name:"عبس", en:"'Abasa"},
    {id:"081", name:"التكوير", en:"At-Takwir"}, {id:"082", name:"الانفطار", en:"Al-Infitar"},
    {id:"083", name:"المطففين", en:"Al-Mutaffifin"}, {id:"084", name:"الانشقاق", en:"Al-Inshiqaq"},
    {id:"085", name:"البروج", en:"Al-Buruj"}, {id:"086", name:"الطارق", en:"At-Tariq"},
    {id:"087", name:"الأعلى", en:"Al-A'la"}, {id:"088", name:"الغاشية", en:"Al-Ghashiyah"},
    {id:"089", name:"الفجر", en:"Al-Fajr"}, {id:"090", name:"البلد", en:"Al-Balad"},
    {id:"091", name:"الشمس", en:"Ash-Shums"}, {id:"092", name:"الليل", en:"Al-Layl"},
    {id:"093", name:"الضحى", en:"Ad-Duha"}, {id:"094", name:"الشرح", en:"Ash-Sharh"},
    {id:"095", name:"التين", en:"At-Tin"}, {id:"096", name:"العلق", en:"Al-'Alaq"},
    {id:"097", name:"القدر", en:"Al-Qadr"}, {id:"098", name:"البينة", en:"Al-Bayyinah"},
    {id:"099", name:"الزلزلة", en:"Az-Zalzalah"}, {id:"100", name:"العاديات", en:"Al-'Adiyat"},
    {id:"101", name:"القارعة", en:"Al-Qari'ah"}, {id:"102", name:"التكاثر", en:"At-Takathur"},
    {id:"103", name:"العصر", en:"Al-'Asr"}, {id:"104", name:"الهمزة", en:"Al-Humazah"},
    {id:"105", name:"الفيل", en:"Al-Fil"}, {id:"106", name:"قريش", en:"Quraysh"},
    {id:"107", name:"الماعون", en:"Al-Ma'un"}, {id:"108", name:"الكوثر", en:"Al-Kawthar"},
    {id:"109", name:"الكافرون", en:"Al-Kafirun"}, {id:"110", name:"النصر", en:"An-Nasr"},
    {id:"111", name:"المسد", en:"Al-Masad"}, {id:"112", name:"الإخلاص", en:"Al-Ikhlas"},
    {id:"113", name:"الفلق", en:"Al-Falaq"}, {id:"114", name:"الناس", en:"An-Nas"}
];

// قائمة الشيوخ (أسماء الصور بدون مجلد images لأنك رفعتهم في الصفحة الرئيسية)
const reciters = [
    { name: "ياسر الدوسري", img: "yasser.jpg", server: "https://server11.mp3quran.net/yasser/", role: "إمام الحرم" },
    { name: "ماهر المعيقلي", img: "maher.jpg", server: "https://server12.mp3quran.net/maher/", role: "إمام الحرم" },
    { name: "عبد الرحمن السديس", img: "sudais.jpg", server: "https://server11.mp3quran.net/sds/", role: "إمام الحرم" },
    { name: "سعود الشريم", img: "shuraim.jpg", server: "https://server7.mp3quran.net/shur/", role: "إمام الحرم" },
    { name: "عبد الله الجهني", img: "johani.jpg", server: "https://server13.mp3quran.net/jhn/", role: "إمام الحرم" },
    { name: "مشاري العفاسي", img: "afasy.jpg", server: "https://server8.mp3quran.net/afs/", role: "قارئ" },
    { name: "ناصر القطامي", img: "qatami.jpg", server: "https://server6.mp3quran.net/qtm/", role: "قارئ" },
    { name: "محمد اللحيدان", img: "lahdan.jpg", server: "https://server8.mp3quran.net/lhdan/", role: "قارئ" },
    { name: "عبد الباسط عبد الصمد", img: "basit.jpg", server: "https://server7.mp3quran.net/basit/", role: "قارئ" },
    { name: "محمود خليل الحصري", img: "husary.jpg", server: "https://server13.mp3quran.net/husr/", role: "قارئ" },
    { name: "خالد الجليل", img: "jalil.jpg", server: "https://server10.mp3quran.net/jleel/", role: "قارئ" },
    { name: "إدريس أبكر", img: "abkar.jpg", server: "https://server6.mp3quran.net/abkr/", role: "قارئ" },
    { name: "أحمد العجمي", img: "ajmi.jpg", server: "https://server10.mp3quran.net/ajm/", role: "قارئ" },
    { name: "سعد الغامدي", img: "ghamdi.jpg", server: "https://server7.mp3quran.net/s_gmd/", role: "قارئ" },
    { name: "فارس عباد", img: "abbad.jpg", server: "https://server8.mp3quran.net/frs_a/", role: "قارئ" },
    { name: "محمود علي البنا", img: "banna.jpg", server: "https://server8.mp3quran.net/bna/", role: "قارئ" },
    { name: "مصطفى إسماعيل", img: "mustafa.jpg", server: "https://server8.mp3quran.net/mustafa/", role: "قارئ" },
    { name: "عبد الله المطرود", img: "matrood.jpg", server: "https://server8.mp3quran.net/mtrod/", role: "قارئ" },
    { name: "محمد صديق المنشاوي", img: "minshawi.jpg", server: "https://server10.mp3quran.net/minsh/", role: "قارئ" },
    { name: "هاني الرفاعي", img: "rifai.jpg", server: "https://server8.mp3quran.net/hani/", role: "قارئ" }
];

let currentServer = reciters[0].server;
let currentReciterName = reciters[0].name;
let currentSurahIndex = 0;
let isLoop = false;

const audio = document.getElementById('audioPlayer');
const playIcon = document.getElementById('playIcon');

function renderReciters() {
    const grid = document.getElementById('recitersGrid');
    let html = '';
    reciters.forEach((r, i) => {
        html += `
            <div class="reciter-card" onclick="openSurahs(${i})">
                <img src="${r.img}" class="reciter-img" onerror="this.style.background='#333'; this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                <div class="reciter-name">${r.name}</div>
                <div class="reciter-role">${r.role}</div>
            </div>
        `;
    });
    grid.innerHTML = html;
}

function goBack(pageId) {
    document.querySelectorAll('.phone-wrapper > div').forEach(p => p.classList.add('hidden'));
    document.getElementById(pageId).classList.remove('hidden');
}

function openSurahs(index) {
    currentServer = reciters[index].server;
    currentReciterName = reciters[index].name;
    document.getElementById('reciterNameTitle').innerText = currentReciterName;
    
    let html = '';
    surahList.forEach((s, idx) => {
        html += `
            <div class="surah-item" id="surah-item-${idx}" onclick="playSurah(${idx})">
                <div class="surah-info">
                    <div class="surah-num">${parseInt(s.id)}</div>
                    <div class="surah-name">${s.name}</div>
                </div>
                <div class="surah-translated">${s.en}</div>
            </div>
        `;
    });
    document.getElementById('surahListContainer').innerHTML = html;
    goBack('surahsPage');
}

function playSurah(idx) {
    currentSurahIndex = idx;
    const surah = surahList[idx];
    const audioUrl = currentServer + surah.id + ".mp3";
    
    audio.src = audioUrl;
    audio.loop = isLoop; // تفعيل التكرار لو شغال
    
    document.getElementById('playerTitle').innerText = surah.name;
    document.getElementById('playerArtist').innerText = currentReciterName;
    
    audio.play().then(() => {
        playIcon.className = 'fa-solid fa-pause';
    }).catch(() => {});

    document.querySelectorAll('.surah-item').forEach((el, i) => {
        if (i === idx) el.classList.add('active');
        else el.classList.remove('active');
    });

    openQuranPage(surah.id, surah.name);
}

async function openQuranPage(surahId, surahName) {
    goBack('quranPage');
    document.getElementById('quranTitle').innerText = surahName;
    const container = document.getElementById('quranTextContainer');
    container.innerHTML = '<div style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</div>';

    try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${parseInt(surahId)}/quran-uthmani`);
        const data = await res.json();
        let html = '';
        
        data.data.ayahs.forEach((ayah, i) => {
            let text = ayah.text;
            if (i === 0 && surahId !== "001" && surahId !== "009") {
                text = text.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, '');
            }
            html += `<span>${text}<span class="ayah-marker">${ayah.numberInSurah}</span></span> `;
        });
        container.innerHTML = html;
        window.scrollTo(0,0);
    } catch (e) {
        container.innerHTML = '<div style="text-align:center; color:red;">حدث خطأ في تحميل الآيات.</div>';
    }
}

function togglePlay() {
    if (!audio.src) { playSurah(0); return; }
    if (audio.paused) {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
    } else {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
    }
}

function nextTrack() {
    let next = (currentSurahIndex + 1) % surahList.length;
    playSurah(next);
}

// تفعيل التكرار
function toggleLoop() {
    isLoop = !isLoop;
    audio.loop = isLoop;
    const btn = document.getElementById('loopBtn');
    if (isLoop) {
        btn.classList.add('active');
    } else {
        btn.classList.remove('active');
    }
}

audio.addEventListener('ended', function() {
    if (!isLoop) {
        nextTrack();
    }
});

renderReciters();
</script>
</body>
</html>
